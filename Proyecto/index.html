<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>TechMarket</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>TechMarket</h1>

            <nav>
                <a href="#">Inicio</a>
                <a href="#">Productos</a>
                <a href="#">Contacto</a>
            </nav>

            <div class="carrito-icono" onclick="toggleCarrito()">🛒 
                <span id="contador">0</span>
            </div>
        </header>
        <main>
            <!-- Carrito desplegable -->
            <div id="carrito-panel" class="oculto">
                <div class="carrito-header">
                    <h2>Carrito</h2>
                    <button onclick="cerrarCarrito()">❌</button>
                </div>

                <ul id="carrito"></ul>
                <p>Total: <span id="total">0</span>€</p>
                <button id="btn-pagar" onclick="pagar()">Pagar</button>
            </div>

            <!-- Filtro -->
            <div class="filtros">
                <button class="filtro-btn activo" data-categoria="todos">Todos</button>
                <button class="filtro-btn" data-categoria="perifericos">Periféricos</button>
                <button class="filtro-btn" data-categoria="pantallas">Pantallas</button>
                <button class="filtro-btn" data-categoria="ordenadores">Ordenadores</button>
            </div>

            <!-- Productos -->
            <div id="productos"></div>

            <h2>Formulario de registro</h2>

            <!-- 5. Formulario de compra -->
            <form id="formulario" class="formulario">
  
                <div class="campo">
                <label>Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
                </div>

                <div class="campo">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com">
                </div>

                <div class="campo">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="********">
                </div>

                <div class="campo">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="********">
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn">Enviar</button>
                    <button type="reset" class="btn">Borrar</button>
                </div>

            </form>

            <div id="errores"></div>
        </main>
        <footer>
            <p>David van Overbeek Crusells - 2026</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
